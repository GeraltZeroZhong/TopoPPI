[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topoppi-hotspot"
version = "3.0.0"
description = "Residue feature extraction and selected-partner ranking for TopoPPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.11"
dependencies = ["topoppi[representation]>=3.0.0", "topoppi-affinity>=3.0.0", "pandas>=2", "scikit-learn>=1.3", "joblib>=1.2"]

[project.optional-dependencies]
neural = ["torch>=2.2"]
sequence = ["esm>=3.2.1"]
xgboost = ["xgboost>=3.2"]

[project.entry-points."topoppi.plugins"]
hotspot = "topoppi_hotspot.plugin:plugin"

[project.scripts]
topoppi-hotspot = "topoppi_hotspot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topoppi_hotspot*"]

[tool.setuptools.package-data]
topoppi_hotspot = ["data/mutation_surface/*.json", "data/mutation_surface/*.npz", "data/mutation_surface/*.md"]
