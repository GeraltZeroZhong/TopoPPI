name: Hotspot plugin

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_artifacts:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install core and the default hotspot model
        run: python -m pip install '.[dev]' ./plugins/affinity ./plugins/hotspot
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run synthetic and installed-model checks
        env:
          HF_HUB_OFFLINE: "1"
        run: xvfb-run -a python -m pytest plugins/hotspot/tests
      - name: Build distributions
        run: |
          python -m build plugins/hotspot
          python -m twine check plugins/hotspot/dist/*
      - uses: actions/upload-artifact@v7
        if: inputs.release_artifacts
        with:
          name: release-hotspot
          path: plugins/hotspot/dist/*
          if-no-files-found: error
