[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topoppi-example-stats"
version = "0.1.0"
description = "Minimal third-party TopoPPI plugin example using shared geometry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["topoppi>=3.0.0"]

[project.entry-points."topoppi.plugins"]
stats = "topoppi_example_stats:plugin"

[tool.setuptools]
py-modules = ["topoppi_example_stats"]
